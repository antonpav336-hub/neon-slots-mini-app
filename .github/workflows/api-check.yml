name: Validate NEON WALLET API
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/api-check.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Compile API modules
        run: python -m compileall -q server
      - name: Run game logic and high-limit tests
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
          JWT_SECRET: test-only-secret
        run: python -m unittest discover -s server/tests -v
